<!doctype html>
<!-- Narrate player: a plain <video> that reports its timeline to Python.

     Hand-rolled Streamlit component (no npm build): speaks the component
     postMessage protocol directly. The component VALUE is the cumulative tick
     log [{w: wall_ms, v: video_t_s, r: rate, k: kind}] — posted on every
     play/pause/seek/rate/end plus an 8s heartbeat while playing. Python maps
     recording wall-time onto video time from these ticks
     (tracking/narration_align.py), so pauses and rewinds during narration
     cost nothing.

     The video file is served from ./media/current.mp4 — a symlink the Narrate
     page rewrites when the coach picks a source. args.nonce changes with the
     selection so the SAME iframe reloads the element (Streamlit keeps the
     iframe alive across reruns when the key is stable, which is exactly what
     keeps playback running while Python reruns). -->
<html>
<head>
  <meta charset="utf-8" />
  <style>
    html, body { margin: 0; padding: 0; background: transparent; }
    video { width: 100%; display: block; border-radius: 8px; background: #000; }
    #bar { font: 12px -apple-system, sans-serif; color: #888; padding: 4px 2px; }
    /* On-field strip: who is on the pitch at the current video time. */
    #onfield { display: none; flex-wrap: wrap; gap: 6px; align-items: center;
               padding: 6px 2px 2px 2px; min-height: 28px;
               font: 13px -apple-system, sans-serif; }
    #onfield .lbl { color: #777; font-size: 11px; margin-right: 2px; }
    #onfield .chip { background: #1d3a24; color: #b9e4c3; border: 1px solid #2e5c39;
                     border-radius: 12px; padding: 2px 9px; white-space: nowrap; }
    #onfield .chip.gk { background: #3a331d; color: #e4d8b9; border-color: #5c522e; }
    #onfield .none { color: #777; font-style: italic; }
  </style>
</head>
<body>
  <video id="v" controls preload="metadata"></video>
  <div id="onfield"></div>
  <div id="bar">no video loaded</div>
  <script>
    const HEARTBEAT_MS = 8000;
    let ticks = [];
    let nonce = null;
    let hb = null;
    let onfield = [];        // [{pid, name, num, gk, iv: [[a,b],...]}] video-secs
    let onfieldSrc = "";
    let lastRoster = null;   // avoid re-rendering identical chip sets
    const v = document.getElementById("v");
    const bar = document.getElementById("bar");
    const strip = document.getElementById("onfield");

    function esc(s) {
      return String(s).replace(/[&<>"]/g, c => (
        {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
    }
    function renderOnfield() {
      if (!onfield.length) { strip.style.display = "none"; return; }
      strip.style.display = "flex";
      const t = v.currentTime || 0;
      const on = onfield.filter(p => p.iv.some(([a, b]) => t >= a && t <= b));
      on.sort((x, y) => (y.gk - x.gk) || ((x.num ?? 99) - (y.num ?? 99)));
      const key = on.map(p => p.pid).join(",");
      if (key === lastRoster) return;
      lastRoster = key;
      const chips = on.map(p =>
        `<span class="chip${p.gk ? " gk" : ""}">${p.gk ? "🧤 " : ""}` +
        `#${p.num ?? "?"} ${esc(p.name)}</span>`).join("");
      strip.innerHTML =
        `<span class="lbl">ON FIELD (${on.length}) · ${esc(onfieldSrc)}</span>` +
        (chips || `<span class="none">no lineup data for this moment</span>`);
      send("streamlit:setFrameHeight", { height: document.body.scrollHeight + 4 });
    }
    v.addEventListener("timeupdate", renderOnfield);
    v.addEventListener("seeked", renderOnfield);

    function send(type, data) {
      window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, data), "*");
    }
    function setValue() {
      send("streamlit:setComponentValue", { dataType: "json", value: { ticks: ticks, n: ticks.length } });
    }
    function tick(kind) {
      ticks.push({ w: Date.now(), v: v.currentTime, r: v.playbackRate, k: kind });
      bar.textContent = `t=${v.currentTime.toFixed(1)}s  rate=${v.playbackRate}  ticks=${ticks.length}  (${kind})`;
      setValue();
    }
    v.addEventListener("play",  () => { tick("play");  clearInterval(hb); hb = setInterval(() => tick("hb"), HEARTBEAT_MS); });
    v.addEventListener("pause", () => { tick("pause"); clearInterval(hb); });
    v.addEventListener("seeked", () => tick("seek"));
    v.addEventListener("ratechange", () => tick("rate"));
    v.addEventListener("ended", () => { tick("end"); clearInterval(hb); });
    v.addEventListener("loadedmetadata", () => {
      bar.textContent = `loaded: ${v.duration.toFixed(0)}s`;
      send("streamlit:setFrameHeight", { height: document.body.scrollHeight + 4 });
    });

    window.addEventListener("message", (ev) => {
      const m = ev.data;
      if (!m || m.type !== "streamlit:render") return;
      const args = (m.args && (m.args.args || m.args)) || {};
      onfield = args.onfield || [];
      onfieldSrc = args.onfield_src || "";
      lastRoster = null;          // args may have changed → force re-render
      renderOnfield();
      if (args.nonce !== nonce) {
        nonce = args.nonce;
        ticks = [];                    // a new video = a new timeline
        // Served by Streamlit's static route (streams with Range support —
        // the component asset route buffers whole files and dies on 86 GB).
        v.src = (args.video_url || "/app/static/current.mp4")
                + "?nonce=" + encodeURIComponent(nonce || "0");
        v.load();
        setValue();
      }
      send("streamlit:setFrameHeight", { height: document.body.scrollHeight + 4 });
    });

    send("streamlit:componentReady", { apiVersion: 1 });
    send("streamlit:setFrameHeight", { height: 420 });
  </script>
</body>
</html>
